title: Home
views:
  # --- TAB 1: Home (security + at-a-glance) ---
  - title: Home
    path: home
    icon: mdi:home
    show_icon_and_title: true
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: true
            forecast_type: daily
            forecast_slots: 7
            grid_options:
              columns: full
              rows: auto
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Doorbell
          - type: picture-entity
            entity: camera.doorbell_main
            camera_view: live
            name: Doorbell
            grid_options:
              columns: full
              rows: auto
      - type: grid
        cards:
          # Collapsed by default — click the title bar / chevron to expand.
          - type: custom:expander-card
            title: Sensors
            expanded: false
            icon: mdi:chevron-down
            cards:
              - type: entities
                entities:
                  - binary_sensor.doorbell_button_pressed
                  - binary_sensor.doorbell_door_status
                  - binary_sensor.doorbell_motion_alarm
                  - binary_sensor.doorbell_cross_line_alarm
                  - binary_sensor.doorbell_smart_motion_human
                  - binary_sensor.doorbell_smart_motion_vehicle
                  - binary_sensor.doorbell_invite
                  - binary_sensor.doorbell_call_no_answered
      - type: grid
        cards:
          # Clips saved by "Doorbell - Tuned Notification" to /config/www/doorbell
          # (doorbell_YYYYMMDD_HHMMSS.mp4 + thumb_YYYYMMDD_HHMMSS.jpg), listed by
          # the command_line sensor.doorbell_records. Ten clips per browser-local page.
          # Load /local/doorbell-records-card.js as a JavaScript module resource.
          - type: custom:expander-card
            title: Recorded clips
            expanded: false
            icon: mdi:chevron-down
            cards:
              - type: custom:doorbell-records-card
                entity: sensor.doorbell_records
                page_size: 10
      - type: grid
        cards:
          - type: heading
            heading: Who's home
          - type: tile
            entity: person.saulius
          - type: tile
            entity: person.sandra
      - type: grid
        cards:
          - type: heading
            heading: Quick actions
          - type: button
            name: All lights off
            icon: mdi:lightbulb-off
            tap_action:
              action: call-service
              service: light.turn_off
              target:
                entity_id:
                  - light.sonoff_100139f4f2
                  - light.sonoff_100139f4eb
                  - light.sonoff_100139fd14

  # --- 1st floor: living/dining, kitchen, entryway/stairwell and boiler room ---
  - title: 1st floor
    path: 1st-floor
    icon: mdi:home-floor-1
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Svetainė
          # Load /local/power-light-tile-card.js?v=3 as a JavaScript module resource.
          - type: custom:power-light-tile-card
            entity: light.sonoff_100139f4f2
            name: LED
            icon: mdi:led-strip-variant
            color: amber
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b2190_1
            power_entity: sensor.sonoff_10018b2190_power_1
            name: Pagrindinis
            icon: mdi:lightbulb
      - type: grid
        cards:
          - type: heading
            heading: Virtuvė, Valgomasis
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b0a0d_1
            power_entity: sensor.sonoff_10018b0a0d_power_1
            name: Pagrindinis
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b0a0d_2
            power_entity: sensor.sonoff_10018b0a0d_power_2
            name: Stalviršis
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b2190_2
            power_entity: sensor.sonoff_10018b2190_power_2
            name: Valgomasis
            icon: mdi:lightbulb
      - type: grid
        cards:
          - type: heading
            heading: Tambūras
          - type: custom:power-light-tile-card
            entity: switch.sonoff_1001556a88_1
            power_entity: sensor.sonoff_1001556a88_power_1
            name: Vidus
          - type: custom:power-light-tile-card
            entity: switch.sonoff_1001556a88_2
            power_entity: sensor.sonoff_1001556a88_power_2
            name: Laukas
      - type: grid
        cards:
          - type: heading
            heading: Laiptinė
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b1920_2
            power_entity: sensor.sonoff_10018b1920_power_2
            name: Apačia
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b1920_1
            power_entity: sensor.sonoff_10018b1920_power_1
            name: Viršus
      - type: grid
        cards:
          - type: heading
            heading: Katilinė
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10017d282f
            name: Katilinė (light/power)
      - type: grid
        cards:
          - type: heading
            heading: Svetainė — Curtains
          - type: tile
            entity: cover.sonoff_1001839a94
            name: Užuolaida 1
            features:
              - type: cover-open-close
          - type: tile
            entity: cover.sonoff_10018b28b2
            name: Užuolaida 2
            features:
              - type: cover-open-close
  # --- 2nd floor: office, bedroom and bathroom lighting ---
  - title: 2nd floor
    path: 2nd-floor
    icon: mdi:home-floor-2
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Darbo kambarys
          - type: custom:power-light-tile-card
            entity: light.sonoff_100139fd14
            power_entity: sensor.sonoff_10018b24a7_power_2
            name: LED apšvietimas
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b24a7_1
            power_entity: sensor.sonoff_10018b24a7_power_1
            name: Pagrindinis
      - type: grid
        cards:
          - type: heading
            heading: Miegamasis
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b28ac_1
            power_entity: sensor.sonoff_10018b28ac_power_1
            name: LED
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b28ac_2
            power_entity: sensor.sonoff_10018b28ac_power_2
            name: Pagrindinis
      - type: grid
        cards:
          - type: heading
            heading: Vonia
          - type: custom:power-light-tile-card
            entity: light.sonoff_100139f4eb
            power_entity: sensor.sonoff_10018b27af_power_2
            name: LED apšvietimas
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b27af_1
            power_entity: sensor.sonoff_10018b27af_power_1
            name: Pagrindinis
  # --- Outside: terrace and storage lighting ---
  - title: Outside
    path: outside
    icon: mdi:tree-outline
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Terasa
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b086a_1
            power_entity: sensor.sonoff_10018b086a_power_1
            name: LED
          - type: custom:power-light-tile-card
            entity: switch.sonoff_10018b086a_2
            power_entity: sensor.sonoff_10018b086a_power_2
            name: Pagrindinis

      - type: grid
        cards:
          - type: heading
            heading: Sandėliukas
          - type: custom:power-light-tile-card
            entity: switch.sandeliukas_sonoff_100266e36c_1
            power_entity: sensor.sandeliukas_sonoff_100266e36c_power_1
            name: Vidus
          - type: custom:power-light-tile-card
            entity: switch.sandeliukas_sonoff_100266e36c_2
            power_entity: sensor.sandeliukas_sonoff_100266e36c_power_2
            name: Laukas

  # --- Comfort (all room heating and boiler controls) ---
  - title: Comfort
    path: comfort
    icon: mdi:thermostat
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Svetainė — Heating
          - type: thermostat
            entity: climate.svetaine_t_living_room_heating
      - type: grid
        cards:
          - type: heading
            heading: Darbo kambarys — Heating
          - type: thermostat
            entity: climate.darbo_k_t_work_room_heating
      - type: grid
        cards:
          - type: heading
            heading: Miegamasis — Heating
          - type: thermostat
            entity: climate.miegamas_t_bedroom_heating
      - type: grid
        cards:
          - type: heading
            heading: Vonia — Heating
          - type: thermostat
            entity: climate.vonia_t_bathroom_heating
      - type: grid
        cards:
          - type: heading
            heading: Katilinė — Boiler controls
          - type: tile
            entity: switch.sonoff_1001d5157a_1
            name: Katilas

  # --- Power (Wallbox) ---
  - title: Power
    path: power
    icon: mdi:flash
    show_icon_and_title: true
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Wallbox EV charger — status & control
          - type: tile
            entity: sensor.wallbox_pulsar_max_ss_status_description
            name: Status
          - type: tile
            entity: switch.wallbox_pulsar_max_ss_pause_resume
            name: Pause / resume
          - type: tile
            entity: lock.wallbox_pulsar_max_ss_lock
            name: Charger lock
          - type: tile
            entity: select.wallbox_pulsar_max_ss_solar_charging
            name: Charging mode
          - type: tile
            entity: number.wallbox_pulsar_max_ss_maximum_charging_current
            name: Max charging current
            features:
              - type: numeric-input
          - type: button
            entity: button.outside_wallbox_pulsar_max_ss_resume_schedule
            name: Resume schedule
      - type: grid
        cards:
          - type: heading
            heading: Wallbox — current session
          - type: tile
            entity: sensor.wallbox_pulsar_max_ss_charging_power
            name: Charging power
          - type: tile
            entity: sensor.wallbox_pulsar_max_ss_added_energy
            name: Added energy
          - type: tile
            entity: sensor.wallbox_pulsar_max_ss_added_range
            name: Added range
          - type: tile
            entity: sensor.wallbox_pulsar_max_ss_cost
            name: Session cost
