title: Home
views:
  # --- TAB 1: Home (security + at-a-glance) ---
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Doorbell
          - type: picture-entity
            entity: camera.doorbell_main
            camera_view: live
            name: Doorbell
          # Collapsed by default — click the title bar / chevron to expand.
          - type: custom:expander-card
            title: Door & security
            expanded: false
            icon: mdi:chevron-down
            cards:
              - type: entities
                entities:
                  - binary_sensor.doorbell_button_pressed
                  - binary_sensor.doorbell_door_status
                  - binary_sensor.doorbell_motion_alarm
                  - binary_sensor.doorbell_cross_line_alarm
                  - binary_sensor.doorbell_smart_motion_human
                  - binary_sensor.doorbell_smart_motion_vehicle
                  - binary_sensor.doorbell_invite
                  - binary_sensor.doorbell_call_no_answered
          # Clips saved by "Doorbell - Tuned Notification" to /config/www/doorbell
          # (doorbell_YYYYMMDD_HHMMSS.mp4 + thumb_YYYYMMDD_HHMMSS.jpg), listed by
          # the command_line sensor.doorbell_records. Newest 20 shown.
          - type: custom:expander-card
            title: Recorded clips
            expanded: false
            icon: mdi:chevron-down
            cards:
              - type: markdown
                content: |-
                  {%- set raw = state_attr('sensor.doorbell_records', 'records') or [] %}
                  {%- set ns = namespace(files=[]) %}
                  {%- for r in raw %}
                    {%- set f = r if r is string else (r.video or r.file or r.filename or r.name or r.path or '') %}
                    {%- set f = (f | string).split('/')[-1] %}
                    {%- if f.startswith('doorbell_') and f.endswith('.mp4') %}{% set ns.files = ns.files + [f] %}{% endif %}
                  {%- endfor %}
                  {%- if ns.files %}
                  {%- for f in (ns.files | unique | sort(reverse=true))[:20] %}
                  {%- set p = f[:-4].split('_') %}
                  {%- set d = p[1] %}{% set t = p[2] %}
                  <a href="/local/doorbell/{{ f }}" target="_blank"><img src="/local/doorbell/thumb_{{ d }}_{{ t }}.jpg" width="96"></a> **{{ d[6:8] }}/{{ d[4:6] }} {{ t[0:2] }}:{{ t[2:4] }}:{{ t[4:6] }}** · [▶️ Play clip](/local/doorbell/{{ f }})

                  {% endfor %}
                  {%- else %}
                  No recordings found.
                  {%- endif %}
      - type: grid
        cards:
          - type: heading
            heading: Who's home
          - type: tile
            entity: person.saulius
          - type: tile
            entity: person.sandra
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: false
      - type: grid
        cards:
          - type: heading
            heading: Quick actions
          - type: button
            name: All lights off
            icon: mdi:lightbulb-off
            tap_action:
              action: call-service
              service: light.turn_off
              target:
                entity_id:
                  - light.sonoff_100139f4f2
                  - light.sonoff_100139f4eb
                  - light.sonoff_100139fd14

  # --- TAB 2: Svetainė (Living/Dining) — template for other rooms ---
  - title: Svetainė
    path: svetaine
    icon: mdi:sofa
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Lighting
          - type: tile
            entity: light.sonoff_100139f4f2
            name: LED apšvietimas
          - type: vertical-stack
            cards:
              - type: button
                entity: switch.sonoff_10018b2190_1
                name: Svetainė
                icon: mdi:lightbulb
                show_state: true
                tap_action:
                  action: toggle
              - type: conditional
                conditions:
                  - condition: state
                    entity: switch.sonoff_10018b2190_1
                    state: "on"
                card:
                  type: tile
                  entity: sensor.sonoff_10018b2190_power_1
                  name: Svetainė power
          - type: vertical-stack
            cards:
              - type: button
                entity: switch.sonoff_10018b2190_2
                name: Valgomasis
                icon: mdi:lightbulb
                show_state: true
                tap_action:
                  action: toggle
              - type: conditional
                conditions:
                  - condition: state
                    entity: switch.sonoff_10018b2190_2
                    state: "on"
                card:
                  type: tile
                  entity: sensor.sonoff_10018b2190_power_2
                  name: Valgomasis power
      - type: grid
        cards:
          - type: heading
            heading: Curtains
          - type: tile
            entity: cover.sonoff_1001839a94
            name: Užuolaida 1
            features:
              - type: cover-open-close
          - type: tile
            entity: cover.sonoff_10018b28b2
            name: Užuolaida 2
            features:
              - type: cover-open-close
      - type: grid
        cards:
          - type: heading
            heading: Heating
          - type: thermostat
            entity: climate.svetaine_t_living_room_heating
          - type: sensor
            entity: sensor.sonoff_10017ba028_outdoor_temp
            name: Lauko temperatūra
            graph: line
